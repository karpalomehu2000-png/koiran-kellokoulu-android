name: Build Koiran kellokoulu Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare web app
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8 @capacitor/cli@^8 @capacitor-community/text-to-speech@^8 esbuild

          cat > tts-bridge.js <<'EOF'
          import { TextToSpeech } from '@capacitor-community/text-to-speech';

          window.NativeTTS = {
            speak: (text) => TextToSpeech.speak({
              text,
              lang: 'fi-FI',
              rate: 0.88,
              pitch: 1,
              volume: 1,
              queueStrategy: 0
            })
          };
          EOF

          npx esbuild tts-bridge.js --bundle --format=iife --outfile=www/tts-bridge.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          s = p.read_text()

          pattern = r"(?ms)^function speakFinnish\(text\)\s*\{.*?^\}"
          replacement = """function speakFinnish(text){
           if(window.NativeTTS){
             window.NativeTTS.speak(text).catch(err=>console.error("Puhevirhe:",err));
             return;
           }
           if(!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window))return;
           const synth=window.speechSynthesis;
           try{
            synth.cancel();
            if(typeof synth.resume==="function")synth.resume();
            const utterance=new SpeechSynthesisUtterance(text);
            utterance.lang="fi-FI";utterance.rate=0.88;utterance.pitch=1;utterance.volume=1;
            const voices=typeof synth.getVoices==="function"?synth.getVoices():[];
            const finnish=voices.find(v=>/^fi([_-]|$)/i.test(v.lang||""));
            if(finnish)utterance.voice=finnish;
            synth.speak(utterance);
           }catch(err){
            try{const u=new SpeechSynthesisUtterance(text);u.lang="fi-FI";synth.speak(u);}catch(_){ }
           }
          }"""

          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Puhetoimintoa ei löytynyt – rakennus keskeytetään.")

          if '<script>' not in s:
              raise SystemExit("Pelin käynnistysskriptiä ei löytynyt.")

          s = s.replace('<script>', '<script src="tts-bridge.js"></script>\n<script>', 1)
          p.write_text(s)
          PY

          npx cap init "Koiran kellokoulu" "fi.karpalomehu.koirankellokoulu" --web-dir=www

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: koiran-kellokoulu-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
