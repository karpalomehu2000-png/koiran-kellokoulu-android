
name: Build Koiran kellokoulu Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare web app
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8 @capacitor/cli@^8
          npx cap init "Koiran kellokoulu" "fi.karpalomehu.koirankellokoulu" --web-dir=www

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: koiran-kellokoulu-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
